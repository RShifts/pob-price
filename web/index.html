<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POB 查价工具</title>
<style>
  :root { --bg:#14161c; --panel:#1d2027; --border:#2c3140; --text:#d7dbe2; --dim:#8a91a0; --acc:#e0a63c; --ok:#4caf7d; --err:#e06c5b; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.6 "Segoe UI", "Microsoft YaHei", sans-serif; }
  header { padding:14px 24px; background:linear-gradient(180deg,#232836,#1d2027); border-bottom:1px solid var(--border); }
  header h1 { margin:0; font-size:18px; } header .sub { color:var(--dim); font-size:12px; }
  main { padding:18px 24px; max-width:1400px; margin:0 auto; }
  .panel { background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:14px; margin-bottom:14px; }
  textarea { width:100%; min-height:110px; background:#12141a; color:var(--text); border:1px solid var(--border); border-radius:6px; padding:10px; font:13px/1.5 Consolas, monospace; resize:vertical; }
  .row { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  button { background:var(--acc); color:#1a1200; border:0; border-radius:6px; padding:8px 18px; font-weight:700; cursor:pointer; }
  button.secondary { background:#2c3140; color:var(--text); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  select, input[type=number], input[type=password] { background:#12141a; color:var(--text); border:1px solid var(--border); border-radius:6px; padding:6px 8px; }
  label { color:var(--dim); font-size:12px; }
  .hint { color:var(--dim); font-size:12px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--border); white-space:nowrap; }
  th { color:var(--dim); font-weight:600; position:sticky; top:0; background:var(--panel); }
  td.num { text-align:right; }
  tr.err { color:var(--err); }
  .badge { display:inline-block; padding:1px 8px; border-radius:10px; font-size:11px; background:#2c3140; color:var(--dim); margin-left:6px; }
  .badge.corrupt { background:#4a2a28; color:#e08a7a; }
  .cols { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:1000px){ .cols{ grid-template-columns:1fr; } }
  .progress-wrap { display:none; align-items:center; gap:12px; margin:10px 0; }
  .progress-wrap.show { display:flex; }
  .bar { flex:1; height:8px; background:#12141a; border-radius:4px; overflow:hidden; }
  .bar > div { height:100%; background:var(--acc); width:0%; transition:width .4s; }
  .totals { color:var(--acc); font-weight:700; }
  .table-scroll { max-height:420px; overflow:auto; }
  a { color:#7ab8e0; }
  .error { color:var(--err); }
  .grid2 { display:grid; grid-template-columns:auto 1fr; gap:4px 12px; align-items:center; }
</style>
</head>
<body>
<header>
  <h1>POB 查价工具 <span class="badge">国际服 + 国服</span></h1>
  <div class="sub">粘贴 POB Code / 链接 → 解析装备列表 → 勾选 → 查价，双服价格对比</div>
</header>
<main>
  <div class="panel">
    <div class="row">
      <textarea id="input" placeholder="粘贴 POB Code（或 pobb.in 链接 / 本地 .build 文件路径）"></textarea>
      <button onclick="parseInput()">解析</button>
      <button class="secondary" onclick="pickFile()">读取文件</button>
      <input type="file" id="file" accept=".build,.xml,.code,.txt" style="display:none" onchange="readFile(event)">
    </div>
    <div id="parseInfo" class="hint" style="margin-top:8px"></div>
    <div id="parseError" class="error" style="margin-top:8px"></div>
  </div>

  <div class="panel">
    <div class="grid2">
      <label for="leagueIntl">国际服联赛</label>
      <select id="leagueIntl"></select>
      <label for="leagueCn">国服联赛</label>
      <select id="leagueCn"></select>
      <label for="cookie">国服 Cookie（登录 poe.game.qq.com/trade 后 F12 复制，含 POESESSID）</label>
      <input type="password" id="cookie" placeholder="可选，国服查价需要">
      <label for="mode">匹配模式</label>
      <select id="mode"><option value="loose">宽松 (loose)</option><option value="strict">精确 (strict)</option></select>
      <label for="limit">每个物品取前 N 个挂牌</label>
      <input type="number" id="limit" value="3" min="1" max="10" style="width:70px">
      <label for="online">仅在线</label>
      <input type="checkbox" id="online" checked style="width:auto">
    </div>
    <div class="row" style="margin-top:12px">
      <button id="priceBtn" onclick="price()" disabled>查价（勾选物品；不勾选则全部）</button>
      <button class="secondary" onclick="toggleAll(true)">全选</button>
      <button class="secondary" onclick="toggleAll(false)">全不选</button>
    </div>
    <div class="progress-wrap" id="progressWrap">
      <div class="bar"><div id="progressBar"></div></div>
      <span id="progressText" class="hint"></span>
    </div>
    <div id="priceError" class="error"></div>
  </div>

  <div class="panel" id="itemsPanel" style="display:none">
    <h3 style="margin:0 0 8px">装备列表 <span id="itemCount" class="badge"></span></h3>
    <div class="table-scroll">
      <table id="itemsTable">
        <thead><tr><th></th><th>名称</th><th>基底</th><th>稀有度</th><th>类别</th><th>ILv</th><th>孔</th><th>腐化</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <div class="cols" id="resultCols" style="display:none">
    <div class="panel">
      <h3 style="margin:0 0 4px">🌍 国际服价格 <span id="intlTotal" class="totals"></span></h3>
      <div id="intlSummary" class="hint"></div>
      <div class="table-scroll"><table id="intlTable"><thead><tr><th>物品</th><th class="num">最低</th><th class="num">中位</th><th class="num">均价</th><th class="num">样本</th><th class="num">匹配</th><th>链接</th></tr></thead><tbody></tbody></table></div>
    </div>
    <div class="panel">
      <h3 style="margin:0 0 4px">🇨🇳 国服价格 <span id="cnTotal" class="totals"></span></h3>
      <div id="cnSummary" class="hint"></div>
      <div class="table-scroll"><table id="cnTable"><thead><tr><th>物品</th><th class="num">最低</th><th class="num">中位</th><th class="num">均价</th><th class="num">样本</th><th class="num">匹配</th><th>链接</th></tr></thead><tbody></tbody></table></div>
    </div>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const state = { items: [], gems: [], jobTimer: null, jobId: null };

async function api(url, opts) {
  const r = await fetch(url, opts || {});
  const j = await r.json().catch(() => ({ error: "响应解析失败 HTTP " + r.status }));
  if (!r.ok || j.error) throw new Error(j.error || ("HTTP " + r.status));
  return j;
}

function pickFile() { $("file").click(); }
function readFile(ev) {
  const f = ev.target.files[0]; if (!f) return;
  const reader = new FileReader();
  reader.onload = () => { $("input").value = String(reader.result); parseInput(); };
  reader.readAsText(f);
}

async function parseInput() {
  const input = $("input").value.trim();
  $("parseError").textContent = "";
  if (!input) { $("parseError").textContent = "请粘贴 POB Code / 链接 / 文件路径"; return; }
  try {
    const data = await api("/api/parse", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ input }) });
    state.items = data.items; state.gems = data.gems;
    renderItems(data);
  } catch (e) { $("parseError").textContent = "解析失败: " + e.message; }
}

function renderItems(data) {
  const tbody = $("itemsTable").querySelector("tbody");
  tbody.innerHTML = "";
  for (const it of data.items) {
    const tr = document.createElement("tr");
    tr.className = "item-row";
    tr.innerHTML = `<td><input type="checkbox" class="item-check" value="${it.id}" checked></td>
      <td>${esc(it.name)}${it.corrupted ? '<span class="badge corrupt">腐化</span>' : ""}</td>
      <td>${esc(it.baseType)}</td><td>${esc(it.rarity)}</td><td>${esc(it.category)}</td>
      <td>${it.ilvl ?? ""}</td><td>${esc(it.sockets)}</td><td></td>`;
    tbody.appendChild(tr);
  }
  $("itemsPanel").style.display = "block";
  $("priceBtn").disabled = false;
  $("itemCount").textContent = data.items.length + " 件";
  $("parseInfo").textContent = `${data.info.className ?? "?"} ${data.info.ascendClassName ?? ""} Lv.${data.info.level ?? "?"} | 宝石 ${data.gems.length} 颗 | 天赋节点 ${data.tree?.nodeCount ?? 0} | 来源 ${data.source}`;
}

function toggleAll(on) {
  document.querySelectorAll(".item-check").forEach(cb => cb.checked = on);
}

function selectedIds() {
  return [...document.querySelectorAll(".item-check:checked")].map(cb => cb.value);
}

async function price() {
  $("priceError").textContent = "";
  if (!state.items.length) return $("priceError").textContent = "请先解析构建";
  const ids = selectedIds();
  const input = $("input").value.trim();
  const body = {
    input,
    servers: ["intl", "cn"],
    onlyIds: ids.length ? ids : undefined,      // 未勾选则全部（含宝石）
    includeGems: ids.length ? false : true,
    mode: $("mode").value,
    limit: Number($("limit").value) || 3,
    online: $("online").checked,
    cookie: $("cookie").value.trim() || undefined,
    league: { intl: $("leagueIntl").value || undefined, cn: $("leagueCn").value || undefined },
  };
  $("priceBtn").disabled = true;
  showProgress(0, 1, "启动查价任务...");
  try {
    const { jobId } = await api("/api/price", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    state.jobId = jobId;
    poll();
  } catch (e) {
    $("priceError").textContent = "启动失败: " + e.message;
    $("priceBtn").disabled = false;
  }
}

function showProgress(done, total, label) {
  $("progressWrap").classList.add("show");
  $("progressBar").style.width = total ? Math.min(100, (done / total) * 100) + "%" : "0%";
  $("progressText").textContent = label;
}

async function poll() {
  if (state.jobTimer) clearInterval(state.jobTimer);
  state.jobTimer = setInterval(async () => {
    try {
      const j = await api("/api/price?jobId=" + encodeURIComponent(state.jobId));
      showProgress(j.progress.done, j.progress.total, j.progress.label + "（已完成 " + j.progress.done + "/" + j.progress.total + "）");
      renderPrice("intl", j.partial.intl, j.intl);
      renderPrice("cn", j.partial.cn, j.cn);
      if (j.status === "done" || j.status === "error") {
        clearInterval(state.jobTimer); state.jobTimer = null;
        $("priceBtn").disabled = false;
        if (j.status === "error") $("priceError").textContent = "查价失败: " + (j.error || "");
        if (j.status === "done") showProgress(j.progress.done, j.progress.total, "完成");
      }
    } catch (e) { /* 轮询失败忽略，下次重试 */ }
  }, 1500);
}

function renderPrice(sid, rows, summary) {
  if (!rows) return;
  const tbody = $(sid + "Table").querySelector("tbody");
  tbody.innerHTML = "";
  for (const r of rows) {
    const tr = document.createElement("tr");
    if (r.error) tr.className = "err";
    tr.innerHTML = `<td>${esc(r.name)}${r.gemLevel != null ? ' <span class="badge">lv' + r.gemLevel + '</span>' : ""}${r.count > 1 ? " ×" + r.count : ""}</td>
      <td class="num">${fmt(r.minChaos)}</td><td class="num">${fmt(r.medianChaos)}</td><td class="num">${fmt(r.avgChaos)}</td>
      <td class="num">${r.sampleCount}</td><td class="num">${r.total}</td>
      <td>${r.url ? '<a href="' + esc(r.url) + '" target="_blank">市集</a>' : (r.error ? esc(r.error.slice(0, 40)) : "")}</td>`;
    tbody.appendChild(tr);
  }
  if (summary) {
    $(sid + "Summary").textContent = `${summary.pricedCount} 项成功 / ${summary.failedCount} 项失败，耗时 ${(summary.durationMs / 1000).toFixed(1)}s，联赛 ${summary.league}`;
    $(sid + "Total").textContent = `总净值：最低 ${fmt(summary.totalChaosMin)} | 中位 ${fmt(summary.totalChaosMedian)}`;
  }
  $("resultCols").style.display = "grid";
}

function fmt(v) { return v == null ? "-" : v.toFixed(1) + "c"; }
function esc(s) { return String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }

async function loadLeagues() {
  for (const sid of ["intl", "cn"]) {
    try {
      const j = await api("/api/leagues?server=" + sid);
      const sel = $(sid === "intl" ? "leagueIntl" : "leagueCn");
      sel.innerHTML = "";
      for (const l of j.result || []) {
        const opt = document.createElement("option");
        opt.value = l.id; opt.textContent = l.text;
        sel.appendChild(opt);
      }
    } catch (e) { /* 联赛加载失败忽略 */ }
  }
}
loadLeagues();
</script>
</body>
</html>
