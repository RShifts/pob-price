<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POB 查价工具</title>
<style>
  :root { --bg:#14161c; --panel:#1d2027; --border:#2c3140; --text:#d7dbe2; --dim:#8a91a0; --acc:#e0a63c; --ok:#4caf7d; --err:#e06c5b; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.6 "Segoe UI", "Microsoft YaHei", sans-serif; }
  header { padding:14px 24px; background:linear-gradient(180deg,#232836,#1d2027); border-bottom:1px solid var(--border); }
  header h1 { margin:0; font-size:18px; } header .sub { color:var(--dim); font-size:12px; }
  main { padding:18px 24px; max-width:1400px; margin:0 auto; }
  .panel { background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:14px; margin-bottom:14px; }
  textarea { width:100%; min-height:110px; background:#12141a; color:var(--text); border:1px solid var(--border); border-radius:6px; padding:10px; font:13px/1.5 Consolas, monospace; resize:vertical; }
  .row { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  button { background:var(--acc); color:#1a1200; border:0; border-radius:6px; padding:8px 18px; font-weight:700; cursor:pointer; }
  button.secondary { background:#2c3140; color:var(--text); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  button.small { padding:4px 10px; font-size:12px; }
  select, input[type=number], input[type=password], input[type=text] { background:#12141a; color:var(--text); border:1px solid var(--border); border-radius:6px; padding:6px 8px; }
  label { color:var(--dim); font-size:12px; }
  .hint { color:var(--dim); font-size:12px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--border); white-space:nowrap; }
  th { color:var(--dim); font-weight:600; position:sticky; top:0; background:var(--panel); }
  td.num { text-align:right; }
  tr.err { color:var(--err); }
  .badge { display:inline-block; padding:1px 8px; border-radius:10px; font-size:11px; background:#2c3140; color:var(--dim); margin-left:6px; }
  .badge.corrupt { background:#4a2a28; color:#e08a7a; }
  .cols { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:1000px){ .cols{ grid-template-columns:1fr; } }
  .progress-wrap { display:none; align-items:center; gap:12px; margin:10px 0; }
  .progress-wrap.show { display:flex; }
  .bar { flex:1; height:8px; background:#12141a; border-radius:4px; overflow:hidden; }
  .bar > div { height:100%; background:var(--acc); width:0%; transition:width .4s; }
  .totals { color:var(--acc); font-weight:700; }
  .table-scroll { max-height:420px; overflow:auto; }
  a { color:#7ab8e0; }
  .error { color:var(--err); }
  .grid2 { display:grid; grid-template-columns:auto 1fr; gap:4px 12px; align-items:center; }
  .mod-detail td { background:#171a21; }
  .mod-detail-inner { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .mod-sec { border-left:2px solid var(--border); padding-left:8px; }
  .mod-label { color:var(--acc); font-size:11px; font-weight:700; display:block; margin-bottom:3px; }
  .mod-line { font-size:12px; line-height:1.6; }
  .mod-cn { color:var(--fg); }
  .mod-en { color:var(--dim); font-size:11px; }
  @media (max-width:1000px){ .mod-detail-inner{ grid-template-columns:1fr; } }
  .cookie-line { display:flex; gap:8px; align-items:center; }
  .cookie-line input { flex:1; }
  /* 弹窗 */
  .modal-mask { display:none; position:fixed; inset:0; background:rgba(0,0,0,.6); align-items:center; justify-content:center; z-index:10; }
  .modal-mask.show { display:flex; }
  .modal { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:18px; width:min(640px, 90vw); }
  .modal h3 { margin:0 0 8px; }
  .modal textarea { min-height:90px; }
  .modal .row { margin-top:12px; justify-content:flex-end; }
</style>
</head>
<body>
<header>
  <h1>POB 查价工具 <span class="badge">国际服 + 国服</span></h1>
  <div class="sub">粘贴 POB Code / 链接 → 解析装备列表 → 勾选 → 查价，双服价格对比</div>
</header>
<main>
  <div class="panel">
    <div class="row">
      <textarea id="input" placeholder="粘贴 POB Code（或 pobb.in 链接 / 本地 .build 文件路径）"></textarea>
      <button onclick="parseInput()">解析</button>
      <button class="secondary" onclick="pickFile()">读取文件</button>
      <input type="file" id="file" accept=".build,.xml,.code,.txt" style="display:none" onchange="readFile(event)">
    </div>
    <div id="parseInfo" class="hint" style="margin-top:8px"></div>
    <div id="parseError" class="error" style="margin-top:8px"></div>
  </div>

  <div class="panel">
    <div class="grid2">
      <label for="leagueIntl">国际服联赛</label>
      <select id="leagueIntl"></select>
      <label for="leagueCn">国服联赛</label>
      <select id="leagueCn"></select>
      <label>国服 Cookie（已缓存可免填；登录 poe.game.qq.com/trade 后 F12 复制）</label>
      <div class="cookie-line">
        <input type="password" id="cookie" placeholder="POESESSID=...; POETOKEN=...（浏览器 localStorage 已缓存会自动填入）">
        <button class="small secondary" onclick="clearCookieCache()">清除缓存</button>
      </div>
      <label for="deviation">匹配偏差（%）：词缀数值按此放宽，越大越宽松</label>
      <input type="number" id="deviation" value="10" min="0" max="50" style="width:80px">
      <label for="limit">每个物品取前 N 个挂牌</label>
      <input type="number" id="limit" value="3" min="1" max="10" style="width:70px">
      <label for="delay">请求间隔（ms，防限流）</label>
      <input type="number" id="delay" value="3000" min="1000" step="500" style="width:90px">
      <label for="online">仅在线</label>
      <input type="checkbox" id="online" checked style="width:auto">
    </div>
    <div class="row" style="margin-top:12px">
      <button id="priceIntlBtn" onclick="price('intl')" disabled>🌍 国际服查价</button>
      <button id="priceCnBtn" onclick="price('cn')" disabled>🇨🇳 国服查价</button>
      <button class="secondary" onclick="toggleAll(true)">全选</button>
      <button class="secondary" onclick="toggleAll(false)">全不选</button>
    </div>
    <div class="progress-wrap" id="progressWrap">
      <div class="bar"><div id="progressBar"></div></div>
      <span id="progressText" class="hint"></span>
    </div>
    <div id="priceError" class="error"></div>
  </div>

  <div class="panel" id="itemsPanel" style="display:none">
    <h3 style="margin:0 0 8px">装备列表 <span id="itemCount" class="badge"></span></h3>
    <div class="table-scroll">
      <table id="itemsTable">
        <thead><tr><th></th><th>名称</th><th>基底</th><th>稀有度</th><th>类别</th><th>ILv</th><th>孔</th><th>腐化</th><th>详情</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <div class="cols" id="resultCols" style="display:none">
    <div class="panel">
      <h3 style="margin:0 0 4px">🌍 国际服价格 <span id="intlTotal" class="totals"></span></h3>
      <div id="intlSummary" class="hint"></div>
      <div class="table-scroll"><table id="intlTable"><thead><tr><th>物品</th><th class="num">最低</th><th class="num">中位</th><th class="num">均价</th><th class="num">样本</th><th class="num">匹配</th><th>链接</th></tr></thead><tbody></tbody></table></div>
    </div>
    <div class="panel">
      <h3 style="margin:0 0 4px">🇨🇳 国服价格 <span id="cnTotal" class="totals"></span></h3>
      <div id="cnSummary" class="hint"></div>
      <div class="table-scroll"><table id="cnTable"><thead><tr><th>物品</th><th class="num">最低</th><th class="num">中位</th><th class="num">均价</th><th class="num">样本</th><th class="num">匹配</th><th>链接</th></tr></thead><tbody></tbody></table></div>
    </div>
  </div>
</main>

<!-- 国服 Cookie 输入弹窗 -->
<div class="modal-mask" id="cookieModal">
  <div class="modal">
    <h3>输入国服 Cookie</h3>
    <div class="hint">登录 <a href="https://poe.game.qq.com/trade" target="_blank">poe.game.qq.com/trade</a> → F12 → Network → 任意请求 → 复制请求头 Cookie（含 POESESSID/POETOKEN）。保存后本地缓存，下次免输。</div>
    <textarea id="cookieInput" placeholder="RK=...; POESESSID=...; POETOKEN=..."></textarea>
    <div class="row">
      <button class="secondary" onclick="closeCookieModal()">取消</button>
      <button onclick="saveCookieAndPrice()">保存并查价</button>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const state = { items: [], gems: [], jobs: { intl: null, cn: null }, timers: { intl: null, cn: null }, results: { intl: [], cn: [] }, summaries: { intl: null, cn: null } };

async function api(url, opts) {
  const r = await fetch(url, opts || {});
  const j = await r.json().catch(() => ({ error: "响应解析失败 HTTP " + r.status }));
  if (!r.ok || j.error) throw new Error(j.error || ("HTTP " + r.status));
  return j;
}

/* ---------- Cookie 缓存 ---------- */
const COOKIE_KEY = "pob-price.cn-cookie";
function loadCachedCookie() {
  const c = localStorage.getItem(COOKIE_KEY);
  if (c) $("cookie").value = c;
}
function saveCookieCache(v) { localStorage.setItem(COOKIE_KEY, v); }
function clearCookieCache() { localStorage.removeItem(COOKIE_KEY); $("cookie").value = ""; $("priceError").textContent = "已清除国服 Cookie 缓存"; }
function cachedCookie() {
  const v = ($("cookie").value || "").trim();
  if (v) { saveCookieCache(v); return v; }
  const c = localStorage.getItem(COOKIE_KEY);
  if (c) { $("cookie").value = c; return c; }
  return "";
}

/* ---------- 解析 ---------- */
function pickFile() { $("file").click(); }
function readFile(ev) {
  const f = ev.target.files[0]; if (!f) return;
  const reader = new FileReader();
  reader.onload = () => { $("input").value = String(reader.result); parseInput(); };
  reader.readAsText(f);
}

async function parseInput() {
  const input = $("input").value.trim();
  $("parseError").textContent = "";
  if (!input) { $("parseError").textContent = "请粘贴 POB Code / 链接 / 文件路径"; return; }
  try {
    const data = await api("/api/parse", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ input }) });
    state.items = data.items; state.gems = data.gems;
    renderItems(data);
  } catch (e) { $("parseError").textContent = "解析失败: " + e.message; }
}

function renderItems(data) {
  const tbody = $("itemsTable").querySelector("tbody");
  tbody.innerHTML = "";
  for (const it of data.items) {
    const tr = document.createElement("tr");
    tr.className = "item-row";
    tr.innerHTML = `<td><input type="checkbox" class="item-check" value="${it.id}" checked></td>
      <td>${bi(it.nameCn, it.name)}${it.corrupted ? '<span class="badge corrupt">腐化</span>' : ""}</td>
      <td>${bi(it.baseTypeCn, it.baseType)}</td><td>${esc(it.rarity)}</td><td>${esc(it.category)}</td>
      <td>${it.ilvl ?? ""}</td><td>${esc(it.sockets)}</td><td></td>
      <td><button class="small secondary detail-btn" data-id="${esc(it.id)}">详情</button></td>`;
    tbody.appendChild(tr);
  }
  $("itemsPanel").style.display = "block";
  $("priceIntlBtn").disabled = false;
  $("priceCnBtn").disabled = false;
  $("itemCount").textContent = data.items.length + " 件";
  $("parseInfo").textContent = `${data.info.className ?? "?"} ${data.info.ascendClassName ?? ""} Lv.${data.info.level ?? "?"} | 宝石 ${data.gems.length} 颗 | 天赋节点 ${data.tree?.nodeCount ?? 0} | 来源 ${data.source}`;
}

function toggleAll(on) {
  document.querySelectorAll(".item-check").forEach(cb => cb.checked = on);
}
function selectedIds() {
  return [...document.querySelectorAll(".item-check:checked")].map(cb => cb.value);
}

/* ---------- 查价（按服） ---------- */
function openCookieModal() {
  $("cookieInput").value = $("cookie").value || "";
  $("cookieModal").classList.add("show");
  $("cookieInput").focus();
}
function closeCookieModal() { $("cookieModal").classList.remove("show"); }

async function price(server) {
  $("priceError").textContent = "";
  if (!state.items.length) return $("priceError").textContent = "请先解析构建";
  // 国服：无 Cookie 时弹窗输入
  if (server === "cn") {
    const c = cachedCookie();
    if (!c) { state.pendingServer = "cn"; openCookieModal(); return; }
  }
  await runPrice(server);
}

async function saveCookieAndPrice() {
  const v = ($("cookieInput").value || "").trim();
  if (!v) { $("priceError").textContent = "Cookie 不能为空"; return; }
  saveCookieCache(v);
  $("cookie").value = v;
  closeCookieModal();
  await runPrice("cn");
}

async function runPrice(server) {
  const ids = selectedIds();
  const input = $("input").value.trim();
  const body = {
    input,
    servers: [server],
    onlyIds: ids.length ? ids : undefined,
    includeGems: ids.length ? false : true,
    deviationPct: Number($("deviation").value) || 0,
    limit: Number($("limit").value) || 3,
    delay: Number($("delay").value) || 3000,
    online: $("online").checked,
    cookie: server === "cn" ? cachedCookie() || undefined : undefined,
    league: { [server]: (server === "intl" ? $("leagueIntl").value : $("leagueCn").value) || undefined },
  };
  $("price" + (server === "intl" ? "Intl" : "Cn") + "Btn").disabled = true;
  showProgress(0, 1, "启动查价任务...");
  try {
    const { jobId } = await api("/api/price", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    state.jobs[server] = jobId;
    startPoll(server);
  } catch (e) {
    $("priceError").textContent = "启动失败: " + e.message;
    $("price" + (server === "intl" ? "Intl" : "Cn") + "Btn").disabled = false;
  }
}

function showProgress(done, total, label) {
  $("progressWrap").classList.add("show");
  $("progressBar").style.width = total ? Math.min(100, (done / total) * 100) + "%" : "0%";
  $("progressText").textContent = label;
}

function startPoll(server, isRetry) {
  if (state.timers[server]) clearInterval(state.timers[server]);
  state.timers[server] = setInterval(async () => {
    try {
      const j = await api("/api/price?jobId=" + encodeURIComponent(state.jobs[server]));
      const label = (server === "intl" ? "国际服" : "国服") + " " + j.progress.label;
      showProgress(j.progress.done, j.progress.total, label + "（" + j.progress.done + "/" + j.progress.total + "）");
      if (isRetry) {
        // 重试：把结果按 key 合并进已有列表
        const rows = j.partial[server] || [];
        if (rows.length) {
          const merged = (state.results[server] || []).filter((x) => x.key !== rows[0].key);
          merged.push(rows[0]);
          state.results[server] = merged;
          renderPrice(server);
        }
      } else {
        renderPrice(server, j.partial[server], j[server]);
      }
      if (j.status === "done" || j.status === "error") {
        clearInterval(state.timers[server]); state.timers[server] = null;
        $("price" + (server === "intl" ? "Intl" : "Cn") + "Btn").disabled = false;
        if (j.status === "error") {
          $("priceError").textContent = (server === "intl" ? "国际服" : "国服") + "查价失败: " + (j.error || "");
        } else {
          showProgress(j.progress.done, j.progress.total, (server === "intl" ? "国际服" : "国服") + "查价完成");
          checkCnAuthFailure(server, j);
        }
      }
    } catch (e) { /* 轮询失败忽略，下轮重试 */ }
  }, 1500);
}

// 国服 Cookie 失效检测：全部 401/Unauthorized 时清缓存并提示重输
function checkCnAuthFailure(server, j) {
  if (server !== "cn") return;
  const rows = j.partial.cn || [];
  if (rows.length && rows.every(r => r.error && /401|Unauthorized|Cookie/i.test(r.error))) {
    clearCookieCache();
    $("priceError").textContent = "国服 Cookie 可能已失效，已清除缓存，请重新输入。";
    openCookieModal();
  }
}

function renderPrice(server, rows, summary) {
  if (rows) state.results[server] = rows;
  if (summary) state.summaries[server] = summary;
  const merged = state.results[server] || [];
  const tbody = $(server + "Table").querySelector("tbody");
  tbody.innerHTML = "";
  for (const r of merged) {
    const tr = document.createElement("tr");
    if (r.error) tr.className = "err";
    const retry = (r.error && r.kind === "item" && r.ids && r.ids.length)
      ? ` <button class="small secondary retry-btn" data-server="${server}" data-id="${esc(r.ids[0])}">重试</button>`
      : "";
    const statBadge = r.statCount ? ' <span class="badge">词缀' + r.statCount + "</span>" : "";
    tr.innerHTML = `<td>${bi(r.nameCn, r.name)}${r.gemLevel != null ? ' <span class="badge">lv' + r.gemLevel + '</span>' : ""}${statBadge}${r.count > 1 ? " ×" + r.count : ""}${retry}</td>`,
      <td class="num">${fmt(r.minChaos)}</td><td class="num">${fmt(r.medianChaos)}</td><td class="num">${fmt(r.avgChaos)}</td>
      <td class="num">${r.sampleCount}</td><td class="num">${r.total}</td>
      <td>${r.url ? '<a href="' + esc(r.url) + '" target="_blank">市集</a>' : (r.error ? esc(r.error.slice(0, 30)) : "")}</td>`;
    tbody.appendChild(tr);
  }
  const s = state.summaries[server];
  if (s) {
    $(server + "Summary").textContent = `${s.pricedCount} 项成功 / ${s.failedCount} 项失败，耗时 ${(s.durationMs / 1000).toFixed(1)}s，联赛 ${s.league}`;
    $(server + "Total").textContent = `总净值：最低 ${fmt(s.totalChaosMin)} | 中位 ${fmt(s.totalChaosMedian)}`;
  }
  $("resultCols").style.display = "grid";
}

async function retryItem(server, itemId) {
  const input = $("input").value.trim();
  const body = {
    input,
    servers: [server],
    onlyIds: [itemId],
    includeGems: false,
    deviationPct: Number($("deviation").value) || 0,
    limit: Number($("limit").value) || 3,
    delay: Number($("delay").value) || 3000,
    online: $("online").checked,
    cookie: server === "cn" ? cachedCookie() || undefined : undefined,
    league: { [server]: (server === "intl" ? $("leagueIntl").value : $("leagueCn").value) || undefined },
  };
  showProgress(0, 1, (server === "intl" ? "国际服" : "国服") + " 重试中...");
  try {
    const { jobId } = await api("/api/price", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    state.jobs[server] = jobId;
    startPoll(server, true);
  } catch (e) {
    $("priceError").textContent = "重试启动失败: " + e.message;
  }
}

// 双语显示：中文主显，英文小字辅助
function bi(cn, en) {
  if (!cn || cn === en) return esc(en);
  return esc(cn) + ' <span class="hint" style="font-size:11px">' + esc(en) + "</span>";
}

function fmt(v) { return v == null ? "-" : v.toFixed(1) + "c"; }
function esc(s) { return String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }

async function loadLeagues() {
  for (const sid of ["intl", "cn"]) {
    try {
      const j = await api("/api/leagues?server=" + sid);
      const sel = $(sid === "intl" ? "leagueIntl" : "leagueCn");
      sel.innerHTML = "";
      for (const l of j.result || []) {
        const opt = document.createElement("option");
        opt.value = l.id; opt.textContent = l.text;
        sel.appendChild(opt);
      }
    } catch (e) { /* 联赛加载失败忽略 */ }
  }
}
loadCachedCookie();
loadLeagues();

// 重试按钮：事件委托（避免行内 onclick 的引号/换行转义问题）
document.addEventListener("click", (ev) => {
  const btn = ev.target.closest(".retry-btn");
  if (btn) retryItem(btn.dataset.server, btn.dataset.id);
  const dbtn = ev.target.closest(".detail-btn");
  if (dbtn) toggleDetail(dbtn.dataset.id);
});

// 展开/收起装备详情（词缀分类展示）
function toggleDetail(id) {
  const row = document.querySelector('.item-row input[value="' + id + '"]')?.closest("tr");
  if (!row) return;
  const next = row.nextElementSibling;
  if (next && next.classList.contains("mod-detail")) { next.remove(); return; }
  const it = state.items.find((x) => x.id === id);
  if (!it) return;
  const m = it.mods || {};
  const mc = it.modsCn || {};
  const sections = [
    ["隐性词缀", m.implicit, mc.implicit], ["显性词缀", m.explicit, mc.explicit], ["工艺词缀", m.crafted, mc.crafted],
    ["裂痕词缀", m.fractured, mc.fractured], ["合成词缀", m.synthesized, mc.synthesized], ["附魔词缀", m.enchant, mc.enchant],
  ].filter(([, arr]) => arr && arr.length);
  const html = sections.map(([label, arr, arrCn]) =>
    '<div class="mod-sec"><span class="mod-label">' + label + "</span>" +
    arr.map((x, i) => {
      const c = arrCn && arrCn[i] ? arrCn[i].cn : null;
      const line = c
        ? '<div class="mod-line"><span class="mod-cn">' + esc(c) + "</span> <span class="mod-en">" + esc(x) + "</span></div>"
        : '<div class="mod-line">' + esc(x) + "</div>";
      return line;
    }).join("") + "</div>"
  ).join("");
  const quality = it.quality != null ? " | 品质 +" + it.quality + "%" : "";
  const tr = document.createElement("tr");
  tr.className = "mod-detail";
  tr.innerHTML = '<td colspan="9"><div class="mod-detail-inner">' +
    '<div style="grid-column:1/-1" class="hint">' + esc(it.itemClass || "") + " | ILv " + (it.ilvl ?? "-") + quality + " | 孔 " + esc(it.sockets || "-") + "</div>" +
    (html || '<span class="hint">（无词缀信息）</span>') + "</div></td>";
  row.after(tr);
}
</script>
</body>
</html>
